name: saucedemo-playwright

on:
  push:
    branches: [main]
    paths:
      - "projects/saucedemo/**"
      - ".github/workflows/saucedemo.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/saucedemo/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/saucedemo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/saucedemo/package.json

      - name: Install npm deps
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: projects/saucedemo/playwright-report/
          retention-days: 14
